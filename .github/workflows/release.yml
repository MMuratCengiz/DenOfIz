name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Read version from version.txt
        id: get_version
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  
  build-windows:
    needs: read-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,)'
          msbuild-architecture: x64

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Configure & Build
        uses: lukka/run-cmake@v10
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        with:
          configurePreset: 'Install_Windows'
          buildPreset: 'Install_Windows'

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: install/Install_Windows

  build-linux:
    needs: read-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main"
          sudo apt-get update
          sudo apt-get install -y clang-17 clang++-17 lld-17
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-17 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-17 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-17 100
          sudo apt-get install -y ninja-build build-essential
          sudo apt-get install -y libglu1-mesa-dev freeglut3-dev libvulkan-dev libsdl2-dev
          sudo apt-get install -y libfreetype-dev libharfbuzz-dev
          sudo apt-get install -y libltdl-dev libtool autoconf automake autoconf-archive
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev
          sudo apt-get install -y libibus-1.0-dev libxtst-dev

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Configure & Build
        uses: lukka/run-cmake@v10
        env:
          CC: clang-17
          CXX: clang++-17
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        with:
          configurePreset: 'Install_Linux'
          buildPreset: 'Install_Linux'

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: install/Install_Linux

  build-macos:
    needs: read-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Install dependencies
        run: |
          brew install ninja
          brew install freetype harfbuzz
          brew install sdl2
          brew install autoconf automake autoconf-archive

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Configure & Build
        uses: lukka/run-cmake@v10
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        with:
          configurePreset: 'Install_OSX'
          buildPreset: 'Install_OSX'

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: install/Install_OSX

  build-emscripten:
    needs: read-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential

      - uses: lukka/get-cmake@latest

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Configure & Build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'Install_Emscripten'
          buildPreset: 'Install_Emscripten'

      - name: Upload Emscripten Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emscripten-release
          path: install/Install_Emscripten

  create-release:
    needs: [read-version, build-windows, build-linux, build-macos, build-emscripten]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release/linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release/macos

      - name: Download Emscripten Artifacts
        uses: actions/download-artifact@v4
        with:
          name: emscripten-release
          path: release/emscripten

      - name: Create Release Archive
        run: |
          cd release
          zip -r ../DenOfIzGraphics-${{ needs.read-version.outputs.version }}.zip .

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: DenOfIzGraphics-${{ needs.read-version.outputs.version }}
          path: DenOfIzGraphics-${{ needs.read-version.outputs.version }}.zip